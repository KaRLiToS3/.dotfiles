
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

###################
### MONITORS    ###
###################

# EL CAMBIO CLAVE: Cambia la escala de 1 a 1.6 (o 1.5)
# Para 2560x1600 en 16 pulgadas, 1.6 suele ser el "sweet spot".
# Esto arreglará Nautilus, VS Code y Kicad de golpe.
monitor=eDP-1,2560x1600@240,0x0,1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = nemo
# Limpiamos los flags de escalado forzado del navegador, ya no hacen falta con el monitor escalado
$browser = brave --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

# exec-once = $terminal
exec-once = nm-applet &
exec-once = waybar
exec-once = hyprpaper
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh,gpg
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# xsettingsd es necesario para que apps GTK antiguas lean la config de nwg-look
exec-once = xsettingsd 
exec-once = udiskie --tray
exec-once = imwheel -b "45"
exec-once = blueman-applet
exec-once = swayidle -w \
    timeout 300 'hyprctl dispatch dpms off' \
    resume 'hyprctl dispatch dpms on' \
    timeout 900 'systemctl suspend' \
    before-sleep 'swaylock -f -c 000000'

#############################
### ENVIRONMENT VARIABLES ###
#############################

# --- Desktop Essentials ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Wayland Backend Enforcement ---
# Obliga a Firefox y apps basadas en GDK a usar Wayland nativo
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,* env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland

# --- Theming (Managed by nwg-look / qt5ct / qt6ct) ---
# GTK Theme: Ya no lo ponemos aquí para que nwg-look mande, 
# pero la variable GTK_THEME a veces es necesaria si nwg-look falla.
# Si usas nwg-look, intenta NO tener esta línea, descoméntala solo si hay problemas.
# env = GTK_THEME,Orchis-Red-Dark-Compact

# Qt Theming: Lo ideal es usar qt5ct/qt6ct para gestionar esto.
# Si no tienes qt5ct instalado, usa 'gtk3' para que copie el tema de GTK.
env = QT_QPA_PLATFORMTHEME,qt6ct   
# Alternativa si no usas qt6ct: env = QT_QPA_PLATFORMTHEME,gtk3

# --- Cursor ---
# Hyprland ahora gestiona el cursor mejor con estas variables
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,34
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,34

# --- Electron / Chrome Apps ---
# Esto ayuda a que VS Code y otros usen Wayland nativo sin verse borrosos
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

#####################
### LOOK AND FEEL ###
#####################
source = ./sources/look_and_feel.conf

#############
### INPUT ###
#############
source = ./sources/input.conf

###################
### KEYBINDINGS ###
###################
source = ./sources/binds.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################
source = ./sources/window_rules.conf