#######################
### REGLAS ESPECIALES ###
#######################

# Reproductores multimedia
windowrule {
  name = windowrule-20
  float = on
  size = (monitor_w*0.6) (monitor_h*0.6)
  center = on
  match:class = ^(mpv)$
}

# Picture-in-Picture
windowrule {
  name = windowrule-21
  pin = on
  float = on
  size = (monitor_w*0.25) (monitor_h*0.25)
  match:title = ^(Picture-in-Picture)$
}


# Juegos de Steam
windowrule {
  name = windowrule-22
  immediate = on
  fullscreen = on
  match:class = ^(steam_app_.*)$
}


# Password managers
windowrule {
  name = windowrule-23
  float = on
  match:class = ^(keepassxc|bitwarden)$
}

windowrule {
  name = windowrule-24
  size = 800 600
  center = on
  match:class = ^(keepassxc)$
}


# Terminales
windowrule {
  name = windowrule-25
  opacity = 0.9
  match:class = ^(alacritty|kitty)$
}

windowrule {
  name = windowrule-26
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
  match:title = ^(floating-terminal)$
}


##################
### LAYER RULES ###
##################

# Barra superior (Waybar)
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = waybar
}


# Menús
layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0.5
  match:namespace = wofi
}


#####################
### DIÁLOGOS ###
#####################

windowrule {
  name = windowrule-27
  size = 400 300
  center = on
  match:class = ^(zenity)$
}

windowrule {
  name = windowrule-28
  float = on
  center = on
  match:class = ^(polkit-gnome-authentication-agent-1)$
}


####################
### FOCUS RULES ###
####################

windowrule {
  name = windowrule-29
  no_focus = on
  match:class = ^(steam)$
  match:title = ^(notificationtoasts_.*)$
}

windowrule {
  name = windowrule-30
  no_focus = on
  match:class = ^(discord)$
  match:title = ^(Discord Updater)$
}

windowrule {
  name = windowrule-31
  immediate = on
  match:class = ^(password-store)$
}

windowrule {
  name = windowrule-32
  immediate = on
  match:title = ^(.*[Pp]assword.*)$
}
