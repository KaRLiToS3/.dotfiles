# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

#######################
### REGLAS GENERALES ###
#######################

# Evitar que las apps se maximicen automáticamente
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Mejoras XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
}

windowrule {
  name = windowrule-3
  immediate = on
  match:xwayland = 1
}


############################
### VENTANAS FLOTANTES  ###
############################

# xdg-desktop-portal-gtk
windowrule {
  name = windowrule-4
  float = on
  center = on
  size = (monitor_w*0.5) (monitor_h*0.6)
  match:class = ^(xdg-desktop-portal-gtk)$
}


# VSCode File Open/Save Dialog
windowrule {
  name = windowrule-5
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.75)
  match:title = ^(Open|Save|Login).*
}


# Brave Log in Dialog
windowrule {
  name = windowrule-6
  float = on
  center = on
  size = (monitor_w*0.5) (monitor_h*0.6)
  match:initial_title = ^(Sin título - Brave)$
}


# Diálogos del sistema
windowrule {
  name = windowrule-7
  float = on
  match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|gnome-system-monitor|htop|btop)$
}


# Calculadoras
windowrule {
  name = windowrule-8
  float = on
  match:class = ^(gnome-calculator|org.gnome.Calculator|calculator|Calculator|qalculate-gtk)$
}

windowrule {
  name = windowrule-9
  center = on
  size = 400 500
  match:class = ^(gnome-calculator|org.gnome.Calculator)$
}


# Visores de imágenes
windowrule {
  name = windowrule-10
  float = on
  match:class = ^(eog|org.gnome.eog|feh|sxiv|imv)$
}

windowrule {
  name = windowrule-11
  size = (monitor_w*0.5) (monitor_h*0.6)
  move = ((monitor_w*0.5)) ((monitor_h*0.2))
  opacity = 0.9
  match:class = ^(eog|org.gnome.eog)$
}


# Thunar flotante (Super+Shift+D/E)
windowrule {
  name = windowrule-12
  float = on
  size = (monitor_w*0.7) (monitor_h*0.75)
  center = on
  match:class = ^(floating-filemanager)$
}

windowrule {
  name = windowrule-13
  float = on
  size = (monitor_w*0.7) (monitor_h*0.75)
  center = on
  match:title = ^(floating-filemanager)$
}


# Navegador flotante (Super+Shift+F)
windowrule {
  name = windowrule-14
  float = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  center = on
  match:title = ^(floating-browser)$
}


# VS Code flotante (Super+Shift+C)
windowrule {
  name = windowrule-15
  float = on
  size = (monitor_w*0.85) (monitor_h*0.85)
  center = on
  match:title = ^(floating-code)$
}


# Gestores de archivos comprimidos
windowrule {
  name = windowrule-16
  float = on
  match:class = ^(file-roller|org.gnome.FileRoller)$
}

windowrule {
  name = kicad-floating
  immediate = on
  float = on
  size = (monitor_w*0.7) (monitor_h*0.75)
  center = on
  match:class = ^(kicad)$
  match:initial_title = negative:^(.*— KiCad 9.0.*)$
}


################################
### ASIGNACIÓN DE WORKSPACES ###
################################

# Navegadores → Workspace 2
windowrule {
  name = windowrule-17
  workspace = 2
  match:class = ^(brave-browser|firefox|chromium|google-chrome)$
}


# Desarrollo → Workspace 3
windowrule {
  name = windowrule-18
  workspace = 3
  match:class = ^(Code|code-oss|neovim|jetbrains-.*)$
}


# Comunicación → Workspace 4
windowrule {
  name = windowrule-19
  workspace = 4
  match:class = ^(discord|telegram-desktop|Signal|slack|teams)$
}


# Multimedia → Workspace 5
