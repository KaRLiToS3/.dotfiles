# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# My personal keybinds
bind = $mainMod, F, exec, $browser
bind = $mainMod SHIFT, F, exec, $browser --new-window --app="floating-browser"
bind = $mainMod, D, exec, $fileManager
bind = $mainMod SHIFT, D, exec, $fileManager --name="floating-filemanager"
bind = $mainMod, C, exec, code
bind = $mainMod, I, exec, intellij-idea-ultimate-edition
bind = $mainMod SHIFT, C, exec, code --new-window --title="floating-code"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" ~/Imágenes/screenshots/$(date +"%Y-%m-%d_%H-%M-%S").png
bind = $mainMod, A, exec, rofi -show drun
bind = $mainMod SHIFT, W, exec, killall waybar && waybar &

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminal --title "floating-terminal"
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, $fileManager --name="floating-filemanager"
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, $menu --gtk-application-id="floating-menu"
bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Window management utilities
bind = $mainMod, TAB, togglespecialworkspace, hidden  # Toggle hidden workspace (scratchpad)
bind = $mainMod, Z, movetoworkspace, special:hidden  # Move current window to hidden workspace
bind = $mainMod, less, exec, hyprctl dispatch movetoworkspace $(hyprctl activeworkspace -j | jq '.id')  # Move window to current workspace

# Pin/Unpin windows (useful for image viewers)
bind = $mainMod, T, pin  # Pin current window (stays on top on all workspaces)

# Window opacity controls
bind = $mainMod SHIFT, equal, exec, hyprctl setprop active alpha 1.0  # Make window fully opaque
bind = $mainMod SHIFT, minus, exec, hyprctl setprop active alpha 0.7  # Make window semi-transparent

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Using F-keys since your laptop sends F1-F12 instead of XF86 keys
# You may need to adjust these F-key numbers based on your specific laptop
bindel = , F1, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+  # Volume up (adjust F-key as needed)
bindel = , F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-        # Volume down (adjust F-key as needed)
bindel = , F3, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle       # Mute (adjust F-key as needed)
bindel = , F4, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle     # Mic mute (adjust F-key as needed)
bindel = , F5, exec, brightnessctl s 10%-                             # Brightness down (adjust F-key as needed)
bindel = , F6, exec, brightnessctl s 10%+                             # Brightness up (adjust F-key as needed)

# Alternative: Use Fn + F-keys if your laptop requires it
# bindel = Fn, F1, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = Fn, F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = Fn, F3, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = Fn, F4, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = Fn, F5, exec, brightnessctl s 10%-
# bindel = Fn, F6, exec, brightnessctl s 10%+

# Keep the original XF86 binds as backup in case some keys do work
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Mouse
bindn = , mouse:274, exec, wl-copy -pc

